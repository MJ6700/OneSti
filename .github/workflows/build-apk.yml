name: Build and Release One STI APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build One STI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: One-STI-Native-App-v2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: One STI Native Android App v2.0
          body: |
            ## 🎓 One STI Native Android App v2.0
            **Crafted by MJ**

            ### 🚀 What's New in v2.0:
            - **Full Native Android App Suite:**
              - 🏠 **Home / Dashboard**: Interactive Virtual Student ID Card with barcode, Today's Class Schedule, Announcements, and quick portal shortcuts.
              - 📊 **Grades & Evaluations**: Real-time GWA calculator, term breakdowns, and academic standing indicators.
              - 📅 **Class Schedule**: Day-by-day timetable with room, instructor, and course units.
              - 💳 **Student Ledger**: Tuition balance tracker, installment due dates, and accredited payment options.
              - 👤 **Student Profile & Settings**: Account security, 144Hz toggles, and notification testing.
            - **⚡ 144Hz Ultra-Smooth Mode:** Native high-refresh rate mode selection with minimal input latency and GPU pre-rasterization.
            - **🔒 Universal Keep-Signed-In Session Vault:** All student, faculty, and Microsoft 365 accounts stay logged in permanently with 10-year persistent cookie transformation and native token vaulting.
            - **🖤 Solid Black Top & Bottom System Bars:** Modern edge-to-edge styling with crisp white status indicators.
            - **🔔 Real-Time Grade Release Notifications:** Instant local push alerts with direct deep linking to newly posted grades.
            - **🌐 Live Multi-Portal Switcher:** One-tap switching between One STI, STI ELMS (Canvas), Microsoft 365, and Student Services (STS).

            ---
            *Download the `app-debug.apk` asset below to install on your Android device.*
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
